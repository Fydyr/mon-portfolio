# Overlay de dev local - N'EST PAS auto-chargé.
# Usage :
#   docker compose -f docker-compose.yml -f dev/docker-compose.yml up -d --build
#
# - Build avec dev/Dockerfile.dev (display_errors, composer avec deps dev)
# - Bind-mount du code source pour edition à chaud
# - Volume nommé pour vendor (évite d'utiliser celui de l'hôte)
# - Expose les ports (8081 / 8082 / 3306) pour accès direct sans Traefik
# - Désactive les labels Traefik et le réseau "web" (prod uniquement)
#
# Les ports sont bindés sur 127.0.0.1 : sans ça ils écoutent sur 0.0.0.0 et
# exposent MySQL et phpMyAdmin à tout le réseau local de la machine.

services:

  database:
    ports:
      - "127.0.0.1:3306:3306"

  phpmyadmin:
    ports:
      - "127.0.0.1:8081:80"
    labels: []
    networks:
      - lan

  app:
    build:
      context: .
      dockerfile: dev/Dockerfile.dev
    ports:
      - "127.0.0.1:8082:80"
    labels: []
    networks:
      - lan
    volumes:
      - .:/var/www/html
      - dev-vendor:/var/www/html/vendor

networks:
  web:
    external: false

volumes:
  dev-vendor:
